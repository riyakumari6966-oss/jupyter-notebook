<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>INVENTORY ENTRY FORM</h1>
    <form action="">
        <fieldset>
            <legend>Products details</legend>
            <label for="item-name">Item Name:</label>
            <input type="text" id="item-name" name="item-name" placeholder="enter name of item" required>
            <br><br>
            <label for="item-id">Item ID:</label>
            <input type="number" id="item-id" name="item-id" placeholder="enter item id" required>
            <br><br>
            <label for="item-price">Item Price:</label>
            <input type="number" id="item-price" name="item-price" min="0" step="0.01" placeholder="enter the item price" required>
            <br><br>
            <label for="item-stock">Item Stock:</label>
            <input type="number" id="item-stock" name="item-stock" min="0" step="1"placeholder="enter the item stock" required>
            <br><br>
            <label for="item-category">Item Category:</label>
            <select name="item-category" id="item-category">
                <option value="" disabled selected>Select a category</option>
                <option value="POP">POP</option>
                <option value="chini mitti">Chini Mitti</option> 
                <option value="diyas">Diyas</option>
                <option value="decorative items">Decorative Items</option>
            </select>
            <br><br>
            <button type="submit">Submit</button>
        </fieldset>
        
    </form>      
</body>
</html>
